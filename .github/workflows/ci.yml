# Tests and the extension build on every pull request and push to master:
# the extension (node --test), the Piper server contract (node --test, needs
# servers/piper dependencies) and the Kokoro server (python unittest, stdlib).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/piper/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix servers/piper

      - name: Python version
        run: python3 --version

      - name: Tests (extension, Piper server, Kokoro server)
        run: npm test

      - name: Build the extension and check the committed bundles are current
        run: |
          npm run build
          git diff --exit-code -- extension/dist
